version: '3.8'

services:
  secrets-manager:
    image: nginx:alpine
    container_name: customer-secrets-manager
    ports:
      - "8005:80"
    volumes:
      - ./secrets-web:/usr/share/nginx/html:ro
    networks:
      - customer_stack_network
    restart: unless-stopped

networks:
  customer_stack_network:
    external: true