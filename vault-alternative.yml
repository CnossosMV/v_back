version: '3.8'

services:
  vault:
    image: hashicorp/vault:latest
    container_name: customer-vault
    ports:
      - "8005:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=customer-dev-token-123
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_ADDR=http://0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    networks:
      - customer_stack_network
    restart: unless-stopped

networks:
  customer_stack_network:
    external: true